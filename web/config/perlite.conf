server {
    listen 80;
    server_name localhost;

    root /var/www/perlite;
    index index.php index.html index.htm;

    access_log /var/log/nginx/php-access.log;
    error_log /var/log/nginx/php-error.log;


    location / {
        try_files $uri $uri/ /index.php;
    }

    # PHP-FPM Configuration Nginx
    location ~ \.php$ {
        try_files $uri = 404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass perlite:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
	
	location ~ /\.(ht|env) {
        deny all;
    }
    
    location ~* ^/(.*)/.obsidian/appearance.json$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).css$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).map$ {
        allow all;
    }

    location ~ \.(git|github|obsidian|trash) {
        deny all;
    }

    location ~ \.(md|json)$ {
        deny all;
    }

    # vault images and other media can be used by other sites, e.g. as a
    # FoundryVTT scene background or tile: those load them cross-origin and
    # need this header (kept after the deny rules above, which still win)
    location ~* \.(png|jpe?g|gif|webp|avif|svg|bmp|ico|mp4|webm|ogg|mp3|wav|m4a|flac|pdf)$ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

	
}